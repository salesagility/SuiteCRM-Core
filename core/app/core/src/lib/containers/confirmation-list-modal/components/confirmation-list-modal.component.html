<scrm-modal [closable]="true"
            [close]="closeButton"
            [titleKey]="titleKey || ''"
            bodyKlass="m-0 small-font"
            footerKlass="border-0"
            headerKlass="border-0"
            klass="confirmation-list-modal">

    <div class="confirmation-list-modal-body" modal-body>
        <ng-container *ngIf="messageKey">
            <div class="confirmation-list-modal-message">
                <scrm-dynamic-label [labelKey]="messageKey"
                                    [fields]="fields"
                                    [context]="context"
                                    [module]="module">
                </scrm-dynamic-label>
            </div>
        </ng-container>

        <ng-container *ngIf="tableConfig">
            <div class="container-fluid confirmation-list-modal-table-section">
                <div class="row pb-3" *ngIf="showFilterSignal()">
                    <div class="col">
                        <scrm-list-filter *ngIf="filterConfig" [config]="filterConfig"></scrm-list-filter>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <scrm-table [config]="tableConfig"></scrm-table>
                    </div>
                </div>
            </div>

            <ng-container *ngIf="(loading$ | async) as loading">
                <scrm-loading-spinner *ngIf="loading" [overlay]="true"></scrm-loading-spinner>
            </ng-container>
        </ng-container>
    </div>

    <div modal-footer class="confirmation-list-modal-footer">
        <scrm-modal-button-group [activeModal]="activeModal"
                                 [config$]="buttonGroup$">
        </scrm-modal-button-group>
    </div>
</scrm-modal>
