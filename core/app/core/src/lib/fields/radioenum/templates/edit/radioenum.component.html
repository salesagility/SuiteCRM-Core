<div class="radioenum">
    <div *ngFor="let item of this.options;"
         class="radioenum-item">
        <p-radioButton
            [name]="field.name"
            [value]="item.value"
            [formControl]="field.formControl"
            [inputId]="getId(item)">
        </p-radioButton>
        <label [for]="getId(item)">{{ item.label }}</label>
    </div>
</div>
